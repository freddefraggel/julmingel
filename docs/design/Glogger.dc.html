<body>

<style>
body{margin:0;font-family:'Nunito',sans-serif;color:#F7ECDC}

a{color:#D9C3AE;text-decoration:none}a:hover{color:#F7ECDC}
</style>

<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #2B1015; padding: 40px 24px 28px; display: flex; flex-direction: column; gap: 16px">

<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
Tillbaka
</a>
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 32px; font-weight: 700; color: #F7ECDC">Kvällens glögger</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.45; color: #D9C3AE">Sorterna i din provning – i hemlig ordning. Vilket nummer som är vilken gissar du i slutet.</p>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{ glogger }}" as="g" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; border-radius: 18px; overflow: hidden; background: #3D1A20; border: 1px solid #5A2C34">
<div style="height: 96px; background: #4A222A; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#B89C88" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg>
<span style="font-size: 12px; font-weight: 700; color: #D9C3AE">[Bild]</span>
</div>
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px">
<span style="font-size: 15px; font-weight: 800; line-height: 1.25; color: #F7ECDC">{{ g.name }}</span>
<span style="font-size: 13px; line-height: 1.35; color: #D9C3AE">{{ g.desc }}</span>
</div>
</div>
</sc-for>
</div>

<ellipse cx="341" cy="20" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="373.5" cy="16.5" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
</g>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const list = [
['Klassisk röd vinglögg', 'Rött vin, kanel, nejlika och apelsinskal.'],
['Vit glögg', 'Vitt vin med kardemumma och vanilj.'],
['Hemmagjord kryddglögg', 'Värdens egen, extra mycket ingefära.'],
['Portvinsglögg', 'Fyllig och söt med portvin och russin.'],
['Blåbärsglögg', 'Rött vin med blåbär och vanilj.'],
['Rom-glögg', 'Mörk rom, farinsocker och kryddor.']
];
return { glogger: list.map((g) => ({ name: g[0], desc: g[1] })) };
}
}
</script>
</body>
</html>
