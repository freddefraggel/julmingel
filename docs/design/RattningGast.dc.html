<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Rättning</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',sans-serif;color:#F7ECDC}
.bulbs{filter:drop-shadow(0 0 3px rgba(232,176,75,.55))}.bulbs ellipse{animation:tw 2.6s ease-in-out infinite}.bulbs ellipse:nth-child(3n+2){animation-delay:.9s}.bulbs ellipse:nth-child(3n){animation-delay:1.7s}@keyframes tw{0%,100%{opacity:1}50%{opacity:.4}}@media (prefers-reduced-motion:reduce){.bulbs ellipse{animation:none}}
a{color:#E8B04B}a:hover{color:#F3C873}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #2B1015; padding: 48px 24px 28px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; justify-content: space-between; align-items: center">
<span style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #E8B04B">Rättning</span>
<span style="font-size: 15px; font-weight: 700; color: #D9C3AE">Låt 2 · fråga 1 av 3</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #3D1A20; border: 1px solid #5A2C34">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
<span style="font-size: 15px; font-weight: 700; color: #F7ECDC">Låten spelas igen</span>
</div>
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 32px; line-height: 1.15; font-weight: 700; color: #F7ECDC">Vilket år släpptes låten?</h1>
<div style="display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{ answers }}" as="a" hint-placeholder-count="4">
<div style="{{ a.box }}">
<span style="{{ a.letterStyle }}">{{ a.letter }}</span>
<span style="flex-grow: 1; font-size: 20px; font-weight: 800; color: #F7ECDC">{{ a.text }}</span>
<span style="{{ a.tagStyle }}">{{ a.tag }}</span>
</div>
</sc-for>
</div>
<div style="display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #4A222A">
<svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#D98A7E" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
<span style="font-size: 16px; font-weight: 700; color: #F7ECDC">Nära! Ingen poäng på den här.</span>
</div>
<div style="flex-grow: 1"></div>
<div style="display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-radius: 16px; border: 1.5px dashed #5A2C34">
<span style="font-size: 15px; color: #D9C3AE">Dina poäng hittills</span>
<span style="font-size: 20px; font-weight: 800; color: #F7ECDC">3 p</span>
</div>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 36px; pointer-events: none">
<svg width="390" height="36" viewBox="0 0 390 36">
<path d="M0 6Q48.75 22 97.5 6T195 6T292.5 6T390 6" fill="none" stroke="#7A4A50" stroke-width="1.5"></path>
<g class="bulbs">
<ellipse cx="16" cy="16.4" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="48.5" cy="20" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="81" cy="16.5" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="113.5" cy="16.4" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
<ellipse cx="146" cy="20" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="178.5" cy="16.5" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="211" cy="16.4" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="243.5" cy="20" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
<ellipse cx="276" cy="16.5" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="308.5" cy="16.4" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="341" cy="20" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="373.5" cy="16.5" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
</g>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const ans = [['A', '1984', ''], ['B', '1994', 'right'], ['C', '2003', 'mine'], ['D', '2011', '']];
return {
answers: ans.map((a) => {
const right = a[2] === 'right';
const mine = a[2] === 'mine';
return {
letter: a[0],
text: a[1],
tag: right ? 'Rätt svar' : mine ? 'Ditt svar' : '',
tagStyle: 'font-size: 14px; font-weight: 800; color: ' + (right ? '#8FBF9A' : '#D98A7E'),
letterStyle: 'width: 36px; height: 36px; border-radius: 18px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: 800; background: ' + (right ? '#8FBF9A' : mine ? '#D98A7E' : '#2B1015') + '; color: ' + (right ? '#1F3A28' : mine ? '#2B1015' : '#D9C3AE'),
box: 'display: flex; align-items: center; gap: 14px; min-height: 60px; padding: 0 16px; border-radius: 16px; background: #3D1A20; border: 2px solid ' + (right ? '#8FBF9A' : mine ? '#D98A7E' : '#3D1A20') + '; opacity: ' + (right || mine ? 1 : 0.6)
};
})
};
}
}
</script>
</body>
</html>
