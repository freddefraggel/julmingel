<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Hem med pokal</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',sans-serif;color:#F7ECDC}
.bulbs{filter:drop-shadow(0 0 3px rgba(232,176,75,.55))}.bulbs ellipse{animation:tw 2.6s ease-in-out infinite}.bulbs ellipse:nth-child(3n+2){animation-delay:.9s}.bulbs ellipse:nth-child(3n){animation-delay:1.7s}@keyframes tw{0%,100%{opacity:1}50%{opacity:.4}}.spark{animation:tw 1.8s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.bulbs ellipse,.spark{animation:none}}
a{color:#F7ECDC;text-decoration:none}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #2B1015; padding: 48px 24px 32px; display: flex; flex-direction: column; gap: 20px">
<div style="display: flex; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14px; font-weight: 700; color: #D9C3AE">Tack för i kväll</span>
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 34px; font-weight: 700; color: #F7ECDC">Hej Anna!</h1>
</div>
</div>
<div style="{{ cardStyle }}">
<svg role="img" aria-label="{{ cupName }}" width="128" height="128" viewBox="0 0 64 64">
<path d="M18 8h28v16a14 14 0 0 1-28 0z" fill="{{ cup }}" stroke="{{ cupDark }}" stroke-width="2" stroke-linejoin="round"></path>
<path d="M18 13h-6a6 6 0 0 0 6 10M46 13h6a6 6 0 0 1-6 10" fill="none" stroke="{{ cup }}" stroke-width="3.5" stroke-linecap="round"></path>
<path d="M32 13l2.4 5 5.4.6-4 3.7 1.1 5.4L32 25l-4.9 2.7 1.1-5.4-4-3.7 5.4-.6z" fill="{{ cupDark }}"></path>
<path d="M28 38h8v8h-8z" fill="{{ cup }}"></path>
<rect x="20" y="46" width="24" height="8" rx="2" fill="{{ cup }}" stroke="{{ cupDark }}" stroke-width="2"></rect>
<path class="spark" d="M8 10l1.5 3.5L13 15l-3.5 1.5L8 20l-1.5-3.5L3 15l3.5-1.5z" fill="#F7ECDC"></path>
<path class="spark" style="animation-delay: .9s" d="M56 2l1.2 2.8L60 6l-2.8 1.2L56 10l-1.2-2.8L52 6l2.8-1.2z" fill="#F7ECDC"></path>
</svg>
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center">
<span style="font-family: 'Fraunces', serif; font-size: 30px; font-weight: 700; color: #F7ECDC">{{ cupName }}</span>
<span style="font-size: 17px; font-weight: 700; color: #D9C3AE">{{ place }} i musikquizet</span>
</div>
<div style="display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-radius: 999px; background: #2B1015">
<span style="font-size: 16px; font-weight: 800; color: #F7ECDC">10 poäng</span>
<span style="display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 800; color: #E8B04B"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="#E8B04B"></path></svg>22 stjärnor</span>
</div>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<a href="Topplista.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 20px; background: #3D1A20; border: 1px solid #5A2C34; min-height: 112px; box-sizing: border-box">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>
<span style="font-size: 17px; font-weight: 800">Quizets topplista</span>
</a>
<a href="Topplista.dc.html" style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 20px; background: #3D1A20; border: 1px solid #5A2C34; min-height: 112px; box-sizing: border-box">
<svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#E8B04B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h10v6a5 5 0 0 1-10 0z"></path><path d="M16 9.5h1.5a2.5 2.5 0 0 1 0 5H16"></path><path d="M9 2.5c-.6 1 .6 1.8 0 3M12.5 2.5c-.6 1 .6 1.8 0 3"></path><path d="M5 22h12"></path></svg>
<span style="font-size: 17px; font-weight: 800">Kvällens glögg</span>
</a>
</div>
<div style="flex-grow: 1"></div>

<svg aria-hidden="true" width="76" height="58" viewBox="0 0 76 58" style="position: absolute; bottom: 104px; right: 18px; pointer-events: none">
<path d="M4 46Q36 32 72 14" fill="none" stroke="#2F5D46" stroke-width="2.5" stroke-linecap="round"></path>
<path d="M12 42l-5-9M12 42l7-4M22 38l-4-10M22 38l8-3M32 33l-3-10M32 33l8-2M42 28l-2-10M42 28l8-1M52 23l-1-9M52 23l8 0M62 18l0-8M62 18l7 1" fill="none" stroke="#4E8A63" stroke-width="2" stroke-linecap="round"></path>
<circle cx="27" cy="41" r="3" fill="#C4454F"></circle>
<circle cx="32" cy="44" r="3" fill="#C4454F"></circle>
<path d="M56 56C42 46 44 34 51 35C54 35 56 38 56 40C56 38 58 35 61 35C68 34 70 46 56 56z" fill="#B5703F"></path>
<path d="M50 41q3 3 6 0t6 0" fill="none" stroke="#F7ECDC" stroke-width="1.4" stroke-linecap="round"></path>
</svg>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 36px; pointer-events: none">
<svg width="390" height="36" viewBox="0 0 390 36">
<path d="M0 6Q48.75 22 97.5 6T195 6T292.5 6T390 6" fill="none" stroke="#7A4A50" stroke-width="1.5"></path>
<g class="bulbs">
<ellipse cx="16" cy="16.4" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="48.5" cy="20" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="81" cy="16.5" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="113.5" cy="16.4" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
<ellipse cx="146" cy="20" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="178.5" cy="16.5" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="211" cy="16.4" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="243.5" cy="20" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
<ellipse cx="276" cy="16.5" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="308.5" cy="16.4" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="341" cy="20" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="373.5" cy="16.5" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
</g>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"pokal":{"editor":"enum","options":["guld","silver","brons"],"default":"silver"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const p = this.props.pokal ?? 'silver';
const m = {
guld: { cup: '#E8B04B', dark: '#8A5A12', name: 'Guldpokal', place: 'Vinnare' },
silver: { cup: '#C9CED6', dark: '#5F6670', name: 'Silverpokal', place: '2:a plats' },
brons: { cup: '#C98A5B', dark: '#6E3F20', name: 'Bronspokal', place: '3:e plats' }
}[p] || {};
return {
cup: m.cup,
cupDark: m.dark,
cupName: m.name,
place: m.place,
cardStyle: 'display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 28px 20px 24px; border-radius: 28px; background: #3D1A20; border: 2px solid ' + m.cup
};
}
}
</script>
</body>
</html>
