<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<title>Topplista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
<style>
body{margin:0;font-family:'Nunito',sans-serif;color:#F7ECDC}
.bulbs{filter:drop-shadow(0 0 3px rgba(232,176,75,.55))}.bulbs ellipse{animation:tw 2.6s ease-in-out infinite}.bulbs ellipse:nth-child(3n+2){animation-delay:.9s}.bulbs ellipse:nth-child(3n){animation-delay:1.7s}@keyframes tw{0%,100%{opacity:1}50%{opacity:.4}}@media (prefers-reduced-motion:reduce){.bulbs ellipse{animation:none}}
.candy{height:6px;border-radius:3px;background:repeating-linear-gradient(135deg,#F7ECDC 0 6px,#C4454F 6px 12px)}
a{color:#E8B04B}a:hover{color:#F3C873}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; box-sizing: border-box; background: #2B1015; padding: 48px 24px 28px; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-size: 14px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #E8B04B">Kvällens resultat</span>
<h1 style="margin: 0; font-family: 'Fraunces', serif; font-size: 36px; font-weight: 700; color: #F7ECDC">Topplista</h1>
<div class="candy" aria-hidden="true" style="width: 64px"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 14px; padding: 20px; border-radius: 24px; background: #E8B04B; color: #2B1015">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #4A222A">Kvällens glögg</span>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 14px; background: #2B1015; color: #E8B04B; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; flex-shrink: 0">4</div>
<div style="display: flex; flex-direction: column; gap: 0px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4A222A">Vanlig</span>
<span style="font-family: 'Fraunces', serif; font-size: 21px; font-weight: 700">Portvinsglögg · 4,6</span>
</div>
</div>
<div style="display: flex; align-items: center; gap: 12px">
<div style="width: 44px; height: 44px; border-radius: 14px; background: #2B1015; color: #E8B04B; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 19px; flex-shrink: 0">2</div>
<div style="display: flex; flex-direction: column; gap: 0px">
<span style="font-size: 12px; font-weight: 800; letter-spacing: 0.08em; text-transform: uppercase; color: #4A222A">Alkoholfri</span>
<span style="font-family: 'Fraunces', serif; font-size: 21px; font-weight: 700">Äppelglögg · 4,8</span>
</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 13px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; color: #B89C88">Musikquiz · poäng</span>
<sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
<div style="{{ r.style }}">
<span style="width: 28px; font-size: 18px; font-weight: 800; color: #E8B04B">{{ r.pos }}</span>
<sc-if value="{{ r.hasCup }}" hint-placeholder-val="{{ false }}"><svg role="img" aria-label="{{ r.cupName }}" width="22" height="22" viewBox="0 0 24 24"><path d="M7 4h10v5a5 5 0 0 1-10 0z" fill="{{ r.cup }}"></path><path d="M7 6H4.5a2.5 2.5 0 0 0 2.6 3.6M17 6h2.5a2.5 2.5 0 0 1-2.6 3.6M12 14v4M8 20h8" fill="none" stroke="{{ r.cup }}" stroke-width="2" stroke-linecap="round"></path></svg></sc-if>
<span style="flex-grow: 1; font-size: 17px; font-weight: 700; color: #F7ECDC">{{ r.name }}</span>
<span style="font-size: 17px; font-weight: 800; color: #F7ECDC">{{ r.pts }} p</span>
<span style="display: flex; align-items: center; gap: 3px; width: 40px; justify-content: flex-end; font-size: 15px; font-weight: 800; color: #E8B04B"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.4 6.7 19.4l1.2-6L3.4 9.3l6-.7z" fill="#E8B04B"></path></svg>{{ r.st }}</span>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; padding: 16px; border-radius: 16px; border: 1.5px dashed #5A2C34">
<span style="font-size: 15px; font-weight: 800; color: #F7ECDC">Dina gissningar</span>
<span style="font-size: 15px; color: #D9C3AE">Du gissade 4 av 6 rätt – snyggt!</span>
</div>
<svg aria-hidden="true" width="76" height="58" viewBox="0 0 76 58" style="position: absolute; top: 60px; right: 20px; pointer-events: none">
<path d="M4 46Q36 32 72 14" fill="none" stroke="#2F5D46" stroke-width="2.5" stroke-linecap="round"></path>
<path d="M12 42l-5-9M12 42l7-4M22 38l-4-10M22 38l8-3M32 33l-3-10M32 33l8-2M42 28l-2-10M42 28l8-1M52 23l-1-9M52 23l8 0M62 18l0-8M62 18l7 1" fill="none" stroke="#4E8A63" stroke-width="2" stroke-linecap="round"></path>
<circle cx="27" cy="41" r="3" fill="#C4454F"></circle>
<circle cx="32" cy="44" r="3" fill="#C4454F"></circle>
<path d="M56 56C42 46 44 34 51 35C54 35 56 38 56 40C56 38 58 35 61 35C68 34 70 46 56 56z" fill="#B5703F"></path>
<path d="M50 41q3 3 6 0t6 0" fill="none" stroke="#F7ECDC" stroke-width="1.4" stroke-linecap="round"></path>
</svg>
<div aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 390px; height: 36px; pointer-events: none">
<svg width="390" height="36" viewBox="0 0 390 36">
<path d="M0 6Q48.75 22 97.5 6T195 6T292.5 6T390 6" fill="none" stroke="#7A4A50" stroke-width="1.5"></path>
<g class="bulbs">
<ellipse cx="16" cy="16.4" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="48.5" cy="20" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="81" cy="16.5" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="113.5" cy="16.4" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
<ellipse cx="146" cy="20" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="178.5" cy="16.5" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="211" cy="16.4" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="243.5" cy="20" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
<ellipse cx="276" cy="16.5" rx="4" ry="5.5" fill="#E8B04B"></ellipse>
<ellipse cx="308.5" cy="16.4" rx="4" ry="5.5" fill="#C4454F"></ellipse>
<ellipse cx="341" cy="20" rx="4" ry="5.5" fill="#8FBF9A"></ellipse>
<ellipse cx="373.5" cy="16.5" rx="4" ry="5.5" fill="#F7ECDC"></ellipse>
</g>
</svg>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const data = [['Erik', 11, 24], ['Anna', 10, 22], ['Sara', 9, 19], ['Johan', 8, 15], ['Maja', 7, 16]];
const cups = ['#E8B04B', '#C9CED6', '#C98A5B'];
const cupNames = ['Guldpokal', 'Silverpokal', 'Bronspokal'];
return {
rows: data.map((d, i) => ({
pos: i + 1,
name: d[0],
pts: d[1],
st: d[2],
hasCup: i < 3,
cup: cups[i] || '',
cupName: cupNames[i] || '',
style: 'display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 16px; border-radius: 14px; background: #3D1A20; border: 2px solid ' + (d[0] === 'Anna' ? '#E8B04B' : '#3D1A20')
}))
};
}
}
</script>
</body>
</html>
